[project]
name = "plugdrop-sales-crm-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["E501", "B008", "S101", "S311", "S105", "S106", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# pytest fixtures shared by importing them from another test module
"tests/test_outreach_hardening.py" = ["F811"]
"tests/test_engagement.py" = ["F811"]

[tool.mypy]
python_version = "3.12"
plugins = []
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
