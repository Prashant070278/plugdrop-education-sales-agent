# Local development stack: Postgres + FastAPI + Next.js.
#   cp .env.example .env   (then edit secrets)
#   docker compose up --build
#   docker compose exec api python -m app.seed
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plugdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-plugdrop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plugdrop} -d ${POSTGRES_DB:-plugdrop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-plugdrop}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-plugdrop}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # Optional dedicated research worker. To use it, set RESEARCH_WORKER=external in .env
  # and start with: docker compose --profile worker up -d
  worker:
    build: ./api
    profiles: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-plugdrop}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-plugdrop}
    command: ["python", "-m", "app.research.worker"]
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
